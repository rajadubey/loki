# Publishes a release when a PR that changes VERSION merges into main: tests both packages, builds
# the universal DMG, then creates the tag (the version, e.g. 2.0.1) on the merged commit and a GitHub
# release with the DMG, its SHA-256 and loki.sh. Nothing runs on PRs, other branches or tag pushes.
# To rebuild an existing release (or add files to one made on the release page), run this workflow
# by hand from main with its tag: it builds the tagged commit and replaces the files.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. 2.0.1
        required: true

permissions:
  contents: write  # create the tag and release, upload assets

concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'  # merged code only, also when run by hand
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      REBUILD_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Version
        run: |
          if [ -n "$REBUILD_TAG" ]; then
            tag="$REBUILD_TAG"
          else
            tag=$(tr -d '[:space:]' < VERSION)
            if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag is already released. Bump VERSION to release again, or rebuild $tag by hand (Actions → Release → Run workflow)."
              exit 1
            fi
          fi
          v="${tag#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$tag' isn't X.Y.Z"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "LOKI_VERSION=$v" >> "$GITHUB_ENV"

      - name: CLI tests
        run: bash packages/cli/tests/run.sh

      - name: macOS tests
        run: packages/macos/scripts/test.sh

      - name: Build universal app and DMG
        run: packages/macos/scripts/build.sh --dmg  # uses LOKI_VERSION

      - name: Collect release files
        run: |
          mkdir -p dist
          sed "s/^VERSION=.*/VERSION=$LOKI_VERSION/" packages/cli/loki.sh > dist/loki.sh
          cp "packages/macos/.build/app/Loki-$LOKI_VERSION.dmg" "packages/macos/.build/app/Loki-$LOKI_VERSION.dmg.sha256" dist/
          ls -l dist

      - name: Publish
        run: |
          cat > install-notes.md <<EOF
          ## Install the app
          Full steps, including a clean reinstall: [SETUP.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/SETUP.md)
          1. Run nginx as yourself: \`brew install nginx && brew services start nginx\` (never with sudo).
          2. Download **Loki-$LOKI_VERSION.dmg**, open it and drag Loki to Applications.
          3. The app isn't notarized, so macOS blocks the first launch. Open **System Settings → Privacy & Security** and click **Open Anyway**, or run:
             \`xattr -dr com.apple.quarantine /Applications/Loki.app\`
          4. On first launch Loki opens **Setup**, which checks nginx and fixes what's missing.

          ## Install the CLI (macOS and Linux)
          \`curl -o- https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/packages/cli/install.sh | bash\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # Keep the notes written on the release page; add the install steps once.
            body=$(gh release view "$TAG" --json body -q .body)
            case "$body" in
              *"## Install the app"*) ;;
              *) printf '%s\n\n%s\n' "$body" "$(cat install-notes.md)" > notes.md
                 gh release edit "$TAG" --notes-file notes.md ;;
            esac
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Loki $LOKI_VERSION" \
              --notes-file install-notes.md --generate-notes
          fi
