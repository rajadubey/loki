# Builds the macOS DMG and attaches it, with loki.sh, to the GitHub release for a version tag.
# The tag is the version, however it was made: GitHub's "Draft a new release" page,
# `git push origin X.Y.Z`, or scripts/release.sh. If the release already exists (made on the
# release page), the files are added to it; otherwise the release is created.
# To (re)build an existing release, run this workflow by hand with its tag.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build for, e.g. 2.0.0 (built from the branch selected above)
        required: true

permissions:
  contents: write  # create or edit the release and upload assets

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag '$TAG' isn't X.Y.Z"; exit 1; }
          echo "LOKI_VERSION=$v" >> "$GITHUB_ENV"
          repo_v=$(tr -d '[:space:]' < VERSION)
          [ "$repo_v" = "$v" ] || echo "::notice::VERSION file says $repo_v; building as $v from the tag."

      - name: CLI tests
        run: bash packages/cli/tests/run.sh

      - name: macOS tests
        run: packages/macos/scripts/test.sh

      - name: Build universal app and DMG
        run: packages/macos/scripts/build.sh --dmg  # uses LOKI_VERSION

      - name: Collect release files
        run: |
          mkdir -p dist
          sed "s/^VERSION=.*/VERSION=$LOKI_VERSION/" packages/cli/loki.sh > dist/loki.sh
          cp "packages/macos/.build/app/Loki-$LOKI_VERSION.dmg" "packages/macos/.build/app/Loki-$LOKI_VERSION.dmg.sha256" dist/
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > install-notes.md <<EOF
          ## Install the app
          1. Download **Loki-$LOKI_VERSION.dmg**, open it and drag Loki to Applications.
          2. The app isn't notarized, so macOS blocks the first launch. Open **System Settings → Privacy & Security** and click **Open Anyway**, or run:
             \`xattr -dr com.apple.quarantine /Applications/Loki.app\`
          3. On first launch Loki opens **Setup**, which checks nginx and fixes what's missing.

          ## Install the CLI (macOS and Linux)
          \`curl -o- https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/packages/cli/install.sh | bash\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # Keep the notes written on the release page; add the install steps once.
            body=$(gh release view "$TAG" --json body -q .body)
            case "$body" in
              *"## Install the app"*) ;;
              *) printf '%s\n\n%s\n' "$body" "$(cat install-notes.md)" > notes.md
                 gh release edit "$TAG" --notes-file notes.md ;;
            esac
          else
            gh release create "$TAG" dist/* --verify-tag --title "Loki $LOKI_VERSION" \
              --notes-file install-notes.md --generate-notes
          fi
