# CodeQL scan after a PR merges into main: the Swift code and the GitHub Actions workflows, the same
# languages the repo's default setup scanned. Nothing runs on PRs.
# Replaces the repo's CodeQL "default setup", which scans every PR and must stay off
# (Settings → Code security → CodeQL analysis); GitHub rejects this workflow's results while it's on.
name: CodeQL

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: swift, build-mode: autobuild, os: macos-15 }
          - { language: actions, build-mode: none, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
