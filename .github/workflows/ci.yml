# Tests both packages after a PR merges into main. Nothing runs on PRs or other branches;
# run the tests locally before merging (see Development in README.md).
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install jq and shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: CLI tests
        run: bash packages/cli/tests/run.sh

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: packages/macos/scripts/test.sh
      - name: Build app
        run: packages/macos/scripts/build.sh
